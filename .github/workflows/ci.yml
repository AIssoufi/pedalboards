name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Each push to master gets its own group,
# so a later push never cancels it, even while it waits in the queue
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  react-app:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The Jest 23 of the CMS can hang instead of failing when a test crashes its worker
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Frontend
            directory: pedalboards-frontend
          - name: CMS
            directory: pedalboards-cms
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version of the packageManager field of package.json
      - uses: pnpm/action-setup@v6
      # Current Node.js LTS, pinned by .nvmrc so that a new LTS is adopted on purpose
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the whole workspace from its single lockfile, even from the folder of one app
      - name: Install
        run: pnpm install --frozen-lockfile
      # CI=true runs the Jest of the CMS once instead of in watch mode, and makes its build fail on
      # lint warnings. The frontend runs Vitest once and ignores it
      - name: Test
        run: CI=true pnpm test
      - name: Build
        run: CI=true pnpm run build

  core-service:
    name: Core service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pedalboards-core-service
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version of the packageManager field of package.json
      - uses: pnpm/action-setup@v6
      # Current Node.js LTS, pinned by .nvmrc so that a new LTS is adopted on purpose
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the whole workspace from its single lockfile, even from the folder of one app
      - name: Install
        run: pnpm install --frozen-lockfile
      # The tests of the API run in the Workers runtime, against a local D1 filled by the migrations
      - name: Test
        run: pnpm test
      # Bundles the Worker as Workers Builds deploys it, without publishing it
      - name: Build
        run: pnpm run build
      # Checks that the bundle holds no write route nor multipart parser
      - name: Check the bundle
        run: pnpm run check:bundle
